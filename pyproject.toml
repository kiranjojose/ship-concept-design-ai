[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marine-concept-ai"
version = "0.0.1"
description = "AI-assisted preliminary ship design: parametric engine, design-space exploration and surrogates"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Kiran Jose Puthussery" }]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "pydantic>=2.5",
  "pint>=0.23",
  "pyyaml>=6.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]
viz = ["plotly>=5.18"]
ml = ["scikit-learn>=1.4"]
app = ["streamlit>=1.30"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
