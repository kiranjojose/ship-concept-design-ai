# D1.1  Structured reference design dataset  (DRAFT v0.1, 2026-11-07)
#
# Source: K. J. Puthussery, "Design of 75,000 Deadweight Bulk Carrier of 13 Knots
#         Service Speed", B.Tech project report, Dept. of Naval Architecture and
#         Ship Building, SNGCE / APJ Abdul Kalam Technological University, May 2019.
#         Cited below as REPORT. "p." = printed page number, not PDF page.
#
# Rules for this file
#   * Every value carries a unit and a source location in REPORT.
#   * Nothing is invented. Values the report does not contain are null.
#   * Where the report gives conflicting values, `value` holds the one adopted as
#     the reference and `conflicts` lists the others. See docs/missing_data_register.md
#     (IDs like DISC-03) for the reasoning.
#   * `status`: reported  = transcribed as printed
#               derived   = computed here from reported values (method stated)
#               adopted   = chosen among conflicting reported values
#               missing   = not in the report

project:
  name: reference_bulk_carrier
  vessel_type: bulk_carrier
  design_stage: preliminary_concept (B.Tech design project)
  author: Kiran Jose Puthussery
  year: 2019
  classification_basis: Lloyd's Register (LRS) rules; IMO intact stability criteria
  hull_form_basis: BSRA methodical series, modified to transom stern, bulbous bow

requirements:
  deadweight_tonnes:
    value: 75000
    unit: t
    status: reported
    source: "title page; p.8 (2.2); p.138 Table 9.1"
  service_speed_knots:
    value: 13.0
    unit: kn
    status: reported
    source: "title; p.8 (2.2); p.9 (2.4)"
    conflicts:
      - {value: 16.5, source: "p.14 (2.11) 'service speed of 16.5 knots, trial 17.325'", note: "text not used in calc; see DISC-02"}
  trial_speed_knots:
    value: 13.65
    unit: kn
    status: derived
    note: "Vokes PD=7782.89 kW in Table 2.4 is reproduced only with V=13.65 kn (=1.05 x 13). Not stated explicitly."
    source: "p.17-19"
  operating_range_nm:
    value: 6323
    unit: nmi
    status: adopted
    source: "p.8 (2.2 mission analysis)"
    conflicts:
      - {value: 6023, source: "p.10 (2.6), 5475 nm +10%"}
      - {value: 6223, source: "p.31-32 (2.25), used in fuel mass calc"}
      - {value: 5840, source: "p.138 Table 9.1"}
