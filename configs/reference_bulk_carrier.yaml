    hay_point_max_loa_m: {value: 300, unit: m, source: p.9}
    hay_point_max_beam_m: {value: 53, unit: m, source: p.9}
    hay_point_max_draught_m: {value: 17.6, unit: m, source: p.9}
  complement:
