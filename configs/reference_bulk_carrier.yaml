method_chain:   # what the report actually used, in order (see docs/traditional_design_workflow.md)
  - {step: parent_ship_regression, method: "16 parent ships, log fits of ratios vs DWT", source: "p.10-13"}
  - {step: displacement_first_estimate, method: "CD = DWT/Disp = 0.8 -> 93750 t", source: p.14}
  - {step: length_estimates, method: "Schneekluth, Dankwardt, Ashik, parent range -> 190-240 m", source: p.15-16}
  - {step: dimension_sweep, method: "L=200..240 m, B,D,T from mean ratios, CB Dankwardt, lightship Watson-Gilfillan", source: "p.17-19 Table 2.3"}
  - {step: length_selection, method: "DWT-vs-L interpolation -> L=220.5 m", source: p.19}
  - {step: form_coefficients, method: "CW, CM, CP empirical", source: p.19-20}
  - {step: lines, method: "BSRA series charts + transom stern, faired manually", source: "p.20-24, 48-50"}
  - {step: capacity_prelim, method: "empirical volume formulas", source: "p.37-40"}
  - {step: stability_prelim, method: "Prohaska", source: "p.40-42"}
  - {step: freeboard, method: "ILLC Type B-60", source: "p.43-44"}
  - {step: hydrostatics, method: "Bonjean by Simpson + software output", source: "p.51-57"}
  - {step: resistance, method: "Holtrop-Mennen in NavCad (+ 'MAXSURF' table)", source: "p.60-63"}
  - {step: propulsion, method: "empirical w,t; Wageningen B-series Bp-delta charts", source: "p.66-71"}
  - {step: detailed_mass, method: "Watson & Gilfillan with LCG/VCG", source: "p.91-94"}
  - {step: capacity_detailed, method: "Simpson's rule / Autohydro", source: "p.95-98"}
  - {step: trim_stability, method: "Autohydro, IMO criteria", source: "p.100-112"}

provenance:
  source_document: "kiran.pdf (project shared folder), 167 pages, PDF modified 2019-06-12"
  calculation_method: "hand calculation, spreadsheets (not available), NavCad, Autohydro, hydrostatics software (MAXSURF-style output)"
  transcribed_by: "Claude (project assistant), 2026-11-07, from pdftotext extraction + page images"
  assumptions:
    - "Seawater density 1.025 t/m3 and shell factor 1.006 as used in the report."
    - "Where the report conflicts, adopted value is the one used downstream in the most calculations; see missing_data_register."
    - "Printed page numbers refer to the report's own pagination."
  unavailable_sources:
    - spreadsheets
    - Rhino model
    - MAXSURF model
    - NavCad project
    - Autohydro model
    - "lines plan, general arrangement, midship drawings (listed in report but not in the PDF)"
